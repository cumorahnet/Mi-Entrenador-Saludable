        const firebaseConfig = {

        // --- Audio Functions ---
        const whistle = () => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const now = ctx.currentTime;
                const duration = 1.6;
                const createOsc = (freq, type = 'sine', vol = 1.0) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    const mod = ctx.createOscillator();
                    const modGain = ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, now);
                    mod.frequency.setValueAtTime(45, now);
                    modGain.gain.setValueAtTime(freq * 0.1, now);
                    mod.connect(modGain); modGain.connect(osc.frequency);
                    osc.connect(gain); gain.connect(ctx.destination);
                    gain.gain.setValueAtTime(0, now);
                    gain.gain.linearRampToValueAtTime(vol, now + 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + duration);
                    osc.start(now); mod.start(now);
                    osc.stop(now + duration); mod.stop(now + duration);
                };
                createOsc(3500); createOsc(3515, 'triangle', 0.5);
            } catch (e) { console.warn("Whistle failed:", e); }
        };

        // --- Speech Synthesis Functions ---
        const voiceQueue = [];
        let voiceBusy = false;
        const flushVoice = () => {
            if (voiceBusy || voiceQueue.length === 0 || !window.speechSynthesis) return;
            voiceBusy = true;
            const item = voiceQueue.shift();
            const text = typeof item === 'string' ? item : item.text;
            const onEndCallback = typeof item === 'object' && item.onEnd ? item.onEnd : () => {};

            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'es-ES'; msg.rate = 1.05;
            msg.onend = msg.onerror = () => {
                voiceBusy = false;
                onEndCallback();
                flushVoice();
            };
            window.speechSynthesis.speak(msg);
        };
        const speak = (text, interrupt = false, onEnd = null) => {
            if (!window.speechSynthesis) return;
            if (interrupt) { window.speechSynthesis.cancel(); voiceQueue.length = 0; voiceBusy = false; }
            if (text) voiceQueue.push(onEnd ? { text, onEnd } : text);
            flushVoice();
        };

        // --- Helper Functions for Date Ranges (outside components for reusability) ---
        const startOfDay = (date) => {
            const d = new Date(date);
            d.setHours(0, 0, 0, 0);
            return d;
        };

        const endOfDay = (date) => {
            const d = new Date(date);
            d.setHours(23, 59, 59, 999);
            return d;
        };

        const getWeekRange = (date, offset = 0) => {
            const d = startOfDay(new Date(date)); // Crear una copia para no mutar la fecha original
            d.setDate(d.getDate() + offset * 7); // Aplicar desplazamiento de semana
            
            const day = d.getDay(); // 0 for Sunday, 1 for Monday, ..., 6 for Saturday
            // Calcular la diferencia para llegar al lunes de la semana actual del día d.
            // Si es domingo (0), restar 6 días para ir al lunes de la semana anterior.
            // Si es lunes (1), restar 0 días.
            // Si es otro día (ej. miércoles, 3), restar 2 días (3-1).
            const diff = d.getDate() - day + (day === 0 ? -6 : 1); 
            
            const start = startOfDay(new Date(d.setDate(diff)));
            const end = endOfDay(new Date(d.setDate(diff + 6))); // Sumar 6 días al lunes para obtener el domingo
            return { start, end };
        };

        const getMonthRange = (date, offset = 0) => {
            const d = startOfDay(new Date(date)); // Crear una copia
            d.setMonth(d.getMonth() + offset);
            const start = startOfDay(new Date(d.getFullYear(), d.getMonth(), 1));
            const end = endOfDay(new Date(d.getFullYear(), d.getMonth() + 1, 0)); // Last day of month
            return { start, end };
        };

        const getYearRange = (date, offset = 0) => {
            const d = startOfDay(new Date(date)); // Crear una copia
            d.setFullYear(d.getFullYear() + offset);
            const start = startOfDay(new Date(d.getFullYear(), 0, 1));
            const end = endOfDay(new Date(d.getFullYear(), 11, 31));
            return { start, end };
        };
        // --- End Helper Functions for Date Ranges ---

        // --- Helper Function for Workout Step Generation ---
        const generateWorkoutSteps = (workout, defaultParams) => {
            if (!workout) return [];
            const ent = {
                ...defaultParams.entrenamiento,
                ...(workout.phases?.entrenamiento || {})

            const s = [];

            // 1. Inicio - Prepárate
            s.push({
                label: 'PREPÁRATE', seconds: 15, color: 'bg-yellow-400', phase: 'inicio',
                voiceInitial: 'Prepárate para el calentamiento',
                whistleOnStart: false,
                voiceCountdown: true
            });

            // 2. Calentamiento
            WARMUP_STEPS.forEach((ws, i) => {
                s.push({
                    label: ws.label, seconds: 30, color: 'bg-yellow-400', phase: 'calentamiento',
                    voiceInitial: ws.voice || ws.label.toLowerCase(),
                    whistleOnStart: true,
                    voiceCountdown: true
                });
                if (i < WARMUP_STEPS.length - 1) {
                    s.push({
                        label: 'CAMBIO', seconds: 5, color: 'bg-yellow-300', phase: 'cambio-warmup',
                        voiceInitial: 'Cambio', voiceMidpoint: { time: 2, text: WARMUP_STEPS[i + 1].voice },
                        whistleOnStart: false,
                        voiceCountdown: true
                    });
                }
            });
            s.push({
                label: 'DESCANSO', seconds: 20, color: 'bg-rose-400', phase: 'post-warmup',
                voiceInitial: 'Descanso. A continuación, el entrenamiento principal. Piernas.',
                whistleOnStart: false,
                voiceCountdown: true
            });

            // 3. Entrenamiento por ciclos y zonas
            for (let cy = 1; cy <= ent.cycles; cy++) {
                TRAINING_ZONES.forEach((zone, zi) => {
                    for (let r = 1; r <= ent.rounds; r++) {
                        s.push({
                            label: zone, seconds: ent.action, color: 'bg-emerald-400', phase: 'entrenamiento',
                            r, tr: ent.rounds, cy, tc: ent.cycles,
                            voiceInitial: zone.toLowerCase(),
                            whistleOnStart: true,
                            voiceCountdown: true
                        });
                        if (r < ent.rounds) {
                            s.push({
                                label: 'CAMBIO', seconds: ent.change, color: 'bg-yellow-300', phase: 'cambio-ent',
                                voiceInitial: 'Cambio', voiceMidpoint: { time: 2, text: `Siguiente: ${zone.toLowerCase()}` },
                                whistleOnStart: false,
                                voiceCountdown: true
                            });
                        }
                    }
                    if (zi < TRAINING_ZONES.length - 1) {
                        s.push({
                            label: 'DESCANSO', seconds: ent.zoneRest, color: 'bg-sky-500', phase: 'zone-rest',
                            voiceInitial: 'Descanso de zona', voiceMidpoint: { time: 10, text: `Siguiente zona: ${TRAINING_ZONES[zi + 1].toLowerCase()}` },
                            whistleOnStart: false,
                            voiceCountdown: true
                        });
                    }
                });
                if (cy < ent.cycles) {
                    s.push({
                        label: 'DESCANSO', seconds: ent.rest, color: 'bg-rose-500', phase: 'ciclo-rest',
                        voiceInitial: `Descanso de ciclo. Queda ${ent.cycles - cy} ${ent.cycles - cy === 1 ? 'ciclo' : 'ciclos'}`,
                        voiceMidpoint: { time: 10, text: 'Nuevo ciclo. Piernas.' },
                        whistleOnStart: false,
                        voiceCountdown: true
                    });
                }
            }

            // 4. Estiramientos
            s.push({
                label: 'DESCANSO', seconds: 30, color: 'bg-blue-200', phase: 'pre-stretches',
                voiceInitial: 'Descanso. Prepárate para los estiramientos',
                whistleOnStart: false,
                voiceCountdown: true
            });
            for (let i = 0; i < ent.stretchSteps; i++) {
                s.push({
                    label: `ESTIRAMIENTO ${i + 1}`, seconds: ent.stretchAction, color: 'bg-blue-400', phase: 'estiramientos',
                    voiceInitial: `Estiramiento ${i + 1}`,
                    whistleOnStart: true,
                    voiceCountdown: true
                });
                if (i < ent.stretchSteps - 1) {
                    s.push({
                        label: 'CAMBIO', seconds: ent.stretchChange, color: 'bg-blue-200', phase: 'cambio-est',
                        voiceInitial: 'Cambio', voiceMidpoint: { time: 2, text: `Siguiente estiramiento` },
                        whistleOnStart: false,
                        voiceCountdown: true
                    });
                }
            }
            return s;
        };
        // --- End Helper Function for Workout Step Generation ---


        // --- Main App Component ---
        function App() {

            if (loading) return React.createElement('div', { className: "h-full w-full flex items-center justify-center bg-slate-950" }, React.createElement('div', { className: "animate-spin w-8 h-8 border-4 border-orange-500 border-t-transparent rounded-full" }));
            if (!user) return React.createElement(AuthView, { APP_TITLE: APP_TITLE, APP_VERSION: APP_VERSION });

            return (

                        )

        function WorkoutsView({ workouts, user, onStart, onEdit, onCreate }) {

        // --- Create/Edit Workout View Component (convertido de JSX a React.createElement) ---
        function CreateView({ user, workoutToEdit, onCancel }) {
            const initialPhases = workoutToEdit?.phases
                ? {
                    ...DEFAULT_PARAMS,
                    ...workoutToEdit.phases,
                    entrenamiento: {
                        ...DEFAULT_PARAMS.entrenamiento,
                        ...(workoutToEdit.phases.entrenamiento || {})
                    }

                : DEFAULT_PARAMS;

            const [name, setName] = useState(workoutToEdit?.name || '');
            const [phases, setPhases] = useState(initialPhases);
            const [saving, setSaving] = useState(false);

            const update = useCallback((p, f, v) => setPhases(prev => ({ ...prev, [p]: { ...prev[p], [f]: parseInt(v) || 0 } })), []);

            const save = useCallback(async () => {
                if (!name.trim() || saving) return;
                setSaving(true);
                try {
                    const col = db.collection('artifacts').doc(APP_ID).collection('users').doc(user.uid).collection('workouts');

                    const dataToSave = {
                        name: name.toUpperCase(),
                        phases: {

                            entrenamiento: {
                                ...DEFAULT_PARAMS.entrenamiento,
                                ...phases.entrenamiento

                        updatedAt: new Date().toISOString()
                    };

                    if (workoutToEdit?.id) {
                        await col.doc(workoutToEdit.id).update(dataToSave);
                    } else {
                        await col.add({ ...dataToSave, createdAt: new Date().toISOString() });
                    }
                    onCancel();
                } catch (e) {
                    alert("Error al guardar: " + e.message);
                    setSaving(false);

            }, [name, saving, phases, user, workoutToEdit, onCancel]);

            const ENT_FIELDS = [
                { f: 'action', label: 'Acción (s)' },
                { f: 'change', label: 'Cambio (s)' },
                { f: 'rounds', label: 'Rondas' },
                { f: 'cycles', label: 'Ciclos' },
                { f: 'rest', label: 'Descanso Ciclo (s)' },
                { f: 'zoneRest', label: 'Descanso Zona (s)' }
            ];

            const STRETCH_FIELDS = [
                { f: 'stretchSteps', label: 'Pasos Estiramiento' },
                { f: 'stretchAction', label: 'Duración Estir. (s)' },

            return (
                React.createElement('div', { className: "flex-1 flex flex-col bg-slate-950 overflow-hidden text-center italic" },
                    React.createElement('header', { className: "p-6 flex items-center border-b border-white/5 shrink-0" },
                        React.createElement('button', { onClick: onCancel, className: "p-3 bg-slate-900 rounded-2xl shadow-lg text-white" }, "⬅"),
                        React.createElement('h2', { className: "text-xl font-black uppercase flex-1" }, "Configurar")
                    ),

                        return 'Mes Actual';
                    } else if (start.getTime() === getMonthRange(today, -1).start.getTime()) {
                        return 'Mes Anterior';
                    }
                    return `Mes: ${start.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' })}`;
                } else if (periodType === 'año') {
                    const today = new Date();
                    const currentYearRange = getYearRange(today, 0);
                    if (start.getTime() === currentYearRange.start.getTime()) {
                        return 'Año Actual';
                    } else if (start.getTime() === getYearRange(today, -1).start.getTime()) {
                        return 'Año Anterior';
                    }
                    return `Año: ${start.getFullYear()}`;
                }
                return '';
            }, [currentPeriodRange, periodType]);

            // Se usa useMemo para memoizar la etiqueta de resumen del período
            const memoizedGetPeriodSummaryLabel = useMemo(() => {
                if (periodOffset === 0) {
                    if (periodType === 'semana') return 'Tiempo en esta semana';
                    if (periodType === 'mes') return 'Tiempo en este mes';
                    if (periodType === 'año') return 'Tiempo en este año';
                }
                return `Tiempo en el período seleccionado`;
            }, [periodOffset, periodType]);


            return (
                React.createElement('div', { className: "flex-1 overflow-y-auto scrollbar-hide p-4 space-y-4 pb-28" },
                    React.createElement('div', { className: "glass-card p-6 text-center" },
                        React.createElement('span', { className: "text-[9px] opacity-40 block mb-1 uppercase" }, "Tiempo Total Acumulado"),
                        React.createElement('span', { className: "text-3xl font-black text-orange-500" }, Math.floor(totalSec / 3600), "h ", Math.floor((totalSec % 3600) / 60), "m")
                    ),

                    React.createElement('div', { className: "flex gap-2" },
                        PERIOD_TYPES.map(p => (
                            React.createElement('button', { key: p, onClick: () => { setPeriodType(p); setPeriodOffset(0); },
                                className: `flex-1 py-3 rounded-xl font-black uppercase text-[10px] transition-all 
                                            ${periodType === p ? 'bg-orange-500 text-white' : 'bg-white/5 text-slate-400'}` },
                                p
                            )
                        ))
                    ),

                    React.createElement('div', { className: "flex items-center justify-between glass-card p-4" },
                        React.createElement('button', { onClick: () => setPeriodOffset(prev => prev - 1),
                                className: "p-2 bg-white/5 text-slate-400 rounded-lg" },
                            React.createElement('svg', { width: "24", height: "24", viewBox: "0 0 24 24", fill: "currentColor" }, React.createElement('path', { d: "M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" }))
                        ),
                        React.createElement('span', { className: "text-sm font-black uppercase italic text-orange-400" },
                            memoizedGetPeriodTitle
                        ),
                        React.createElement('button', { onClick: () => setPeriodOffset(prev => prev + 1),
                                disabled: periodOffset >= 0,
                                className: `p-2 rounded-lg ${periodOffset >= 0 ? 'bg-white/10 text-slate-600 cursor-not-allowed' : 'bg-white/5 text-slate-400'}` },
                            React.createElement('svg', { width: "24", height: "24", viewBox: "0 0 24 24", fill: "currentColor" }, React.createElement('path', { d: "M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z" }))
                        )
                    ),

                    React.createElement('div', { className: "glass-card p-5 flex justify-between items-center" },
                        React.createElement('div', { className: "text-left" },
                            React.createElement('span', { className: "text-[9px] opacity-40 uppercase block" }, memoizedGetPeriodSummaryLabel),
                            React.createElement('span', { className: "text-2xl font-black text-sky-400" }, Math.floor(periodSec / 3600), "h ", Math.floor((periodSec % 3600) / 60), "m")
                        ),
                        React.createElement('div', { className: "text-right" },
                            React.createElement('span', { className: "text-[9px] opacity-40 uppercase block" }, "Sesiones"),
                            React.createElement('span', { className: "text-2xl font-black text-emerald-400" }, filteredHistory.length)
                        )
                    ),
                    React.createElement('div', { className: "glass-card p-4" },
                        React.createElement('div', { style: { height: '200px' } },
                            React.createElement('canvas', { ref: chartRef })
                        )
                    )
                )
            );
        }

        // --- Render Root Component ---
        ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App, null));
    </script>
</body>
</html>
